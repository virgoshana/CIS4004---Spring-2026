<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Team Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="appContainer">
    <div id="inputRow">
      <label for="pokemonInput">Name or ID</label>
      <input type="text" id="pokemonInput" placeholder=>
      <button id="findBtn">Find</button>
    </div>

    <img id="pokemonImage" src="" alt="Pokemon Image" />

    <audio id="pokemonSound" controls></audio>

    <div class="movesRow">
      <select id="move1"></select>
      <select id="move2"></select>
    </div>
    <div class="movesRow">
      <select id="move3"></select>
      <select id="move4"></select>
    </div>

    <button id="addToTeamBtn">Add to Team</button>

    <table id="teamTable">
      <tbody id="teamContainer">
        
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
